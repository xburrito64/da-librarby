[package]
name = "da-librarby"
version = "0.3.1"
license = "GPL-3.0-or-later"
description = "A personal media library and player"
authors = ["xburrito64"]
edition = "2021"

[lib]
# The `_lib` suffix avoids a name clash between the lib and bin targets on Windows,
# see https://github.com/rust-lang/cargo/issues/8519
name = "da_librarby_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libloading = "0.8"
raw-window-handle = "0.6"
regex = "1.13.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
ureq = { version = "3.4.2", features = ["json"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
strsim = "0.11.1"
tauri-plugin-single-instance = "2.5.2"
tauri-plugin-window-state = "2.5.0"
tauri-plugin-autostart = "2.7.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
