<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Da Librarby: a play button shelved between books. Source for `npx tauri icon app-icon.svg`. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b1150"/>
      <stop offset="0.55" stop-color="#5a1677"/>
      <stop offset="1" stop-color="#c2268f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.25" r="0.65">
      <stop offset="0" stop-color="#ff7be3" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ff7be3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="play" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7ff3ff"/>
      <stop offset="1" stop-color="#22c6f0"/>
    </linearGradient>
  </defs>
  <rect x="40" y="40" width="944" height="944" rx="220" fill="url(#bg)"/>
  <rect x="40" y="40" width="944" height="944" rx="220" fill="url(#glow)"/>

  <!-- Books -->
  <rect x="214" y="292" width="132" height="478" rx="26" fill="#fff4e8"/>
  <rect x="214" y="352" width="132" height="34" fill="#ff5fd0"/>
  <rect x="214" y="680" width="132" height="22" fill="#ff5fd0" opacity="0.55"/>
  <rect x="372" y="232" width="112" height="538" rx="26" fill="#ffd2f2"/>
  <rect x="372" y="300" width="112" height="28" fill="#8a2bb0" opacity="0.7"/>
  <rect x="372" y="692" width="112" height="28" fill="#8a2bb0" opacity="0.7"/>

  <!-- Play button -->
  <path d="M540 318 L540 742 L818 530 Z" fill="url(#play)" stroke="url(#play)" stroke-width="56" stroke-linejoin="round"/>

  <!-- Shelf -->
  <rect x="176" y="770" width="672" height="46" rx="23" fill="#ffffff" opacity="0.92"/>
</svg>
